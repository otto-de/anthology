name: Anthology
domains:
    - name: example-domain-a 
      kafka:
        cluster: example-cluster
        topic: example-domain-a-topic
        consumer-group: example-domain-a-group
      aggregates:
      - name: AggregateA
        recognition-path: $.*    

    - name: example-domain-b
      kafka:
        cluster: example-cluster-b
        topic: example-domain-b-topic
        consumer-group: example-domain-b-group
      aggregates:
      - name: AggregateB
        recognition-path: $.*    
        filtering:
          filter-paths: 
            - $[?(@.status < 4)]
        id-transformation: 
          pattern: FooBar.Prefix_([0-9]+)
        transformation:
          spec-file: transform-a.json

    - name: example-domain-c
      kafka:
        cluster: example-cluster
        topic: example-domain-c-topic
        consumer-group: example-domain-c-group
      aggregates:
      - name: AggregateC1
        recognition-path: $.* 
      - name: AggregateC2
        recognition-path: $.*
      - name: AggregateC3
        recognition-path: $.*

domain-relations: 
    - type: one-to-many-config
      from: [example-domain-a, AggregateA]
      to: [example-domain-b, AggregateB]
      from-aggregate-path: $.top.key
    - type: many-to-one-config
      from: [example-domain-b, AggregateB]
      to: [example-domain-c, AggregateC1]
      to-aggregate-path: $.top.key

codomain:
    deduplication:
      batch-size: 20
      batching-duration: 30 seconds
    filtering:
      filter-paths: 
        - $[?(@.status < 4)]
    transformation:
          spec-file: transform-co.json
    header-propagation:
    - type: generate-constant
      name: foo
      value: bar
    - type: generate-uuid
      name: fuu
    kafka:
      cluster: sink-cluster
      topic: target-topic

kafka-clusters:
  - name: sink-cluster
    bootstrap-servers: localhost:9092
  - name: example-cluster
    bootstrap-servers: localhost:9092
  - name: example-cluster-b
    bootstrap-servers: localhost:9092

rocks-db:
  db-path: /data/rocksdb
  cache-size-mb: 512

parallelism: 12